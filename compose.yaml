name: showtime-data-check
services:
  postgres:
    image: postgres:17.7
    environment:
      POSTGRES_DB: showtime_data_check
      POSTGRES_USER: data_check
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    ports: ["127.0.0.1:5434:5432"]
    volumes: [data_check_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U data_check -d showtime_data_check"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    env_file:
      - path: ./private/backend.env
        format: raw
    environment:
      DATABASE_URL: postgresql+psycopg://data_check:${DATA_CHECK_DB_PASSWORD}@postgres:5432/showtime_data_check
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
volumes:
  data_check_postgres:
secrets:
  db_password:
    file: ./private/db-password
